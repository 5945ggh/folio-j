<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPUB 阅读实验室</title><link rel="stylesheet" href="./style.css"><body><header><div><small>FOLIO J · 切片 0</small><h1>原文，始终在原处</h1><p>EPUB 阅读与精确引用实验室</p></div><label class="button">打开本地编译 JSON<input id="file" type="file" accept=".json,application/json" hidden></label></header><main><aside><h2>书籍与章节</h2><select id="books"><option value="">选择内置样书…</option></select><p id="bookTitle">尚未加载材料</p><nav id="chapters"></nav><div id="warnings"></div><p class="hint">本实验仅支持单个已加载资源。跨章节选区暂不支持。使用真实 DOM 文字；尚未测试 Yomitan 扩展。</p></aside><section class="reader"><div class="toolbar"><label>布局 <select id="layout"><option value="horizontal-tb">横排滚动</option><option value="vertical-rl">竖排滚动</option></select></label><label><input id="author" type="checkbox" checked>作者 CSS</label><label>字号 <input id="size" type="range" min="14" max="32" value="20"><output id="sizeValue">20</output></label><button id="capture">捕获选区</button></div><iframe id="frame" sandbox="allow-same-origin" title="隔离的 EPUB 正文"></iframe><div id="status" role="status">选择样书，或打开编译后的 JSON 文件。</div></section><aside class="reference"><h2>引用与定位</h2><p class="hint">划选正文后点击捕获。坐标为 NFC 正文 Unicode 码点半开范围。</p><textarea id="quote" aria-label="引用 JSON" spellcheck="false" placeholder="引用的版本、资源、码点范围与原文快照将在这里显示。可修改后验证拒绝状态。"></textarea><button id="restore">校验并还原选区</button><button id="selftest">运行真实 DOM 自检</button><pre id="results"></pre></aside></main><script type="module" src="./app.mjs"></script></body></html>
