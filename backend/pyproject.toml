[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folio-j-backend"
version = "0.1.0"
description = "Local API for Folio-J"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite",
  "alembic",
  "fastapi",
  "jinja2>=3.1.6",
  "markdown-it-py>=4.2.0",
  "openai>=3.19.2",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "sudachidict-core==20260723",
  "sudachipy==0.6.11",
  "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "hypothesis>=6.168.2",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "alembic", "../scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = "none"
