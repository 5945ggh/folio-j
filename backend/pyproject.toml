[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folio-j-backend"
version = "0.1.0"
description = "Local API for Folio-J"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite",
  "alembic",
  "editables~=0.3",
  "fastapi",
  "httpx",
  "jinja2>=3.1.6",
  "markdown-it-py>=4.2.0",
  "openai>=3.19.2",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "sudachidict-core==20260723",
  "sudachipy==0.6.11",
  "tinycss2>=1.4,<2",
  "uvicorn",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
packaging = [
    "pyinstaller>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
# Keep the editable .pth ASCII so Python 3.11 can start under Windows code pages.
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "src", "backend", "backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/measure_reader_backend.py" = ["E402"]  # Load the measured checkout before imports.

[tool.pyright]
include = ["src", "tests", "alembic", "../scripts"]
extraPaths = ["src", "../scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = "none"
