<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio-J · 数据目录</title>
<style nonce="__FOLIO_STARTUP_NONCE__">
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#252525;background:#f5f5f4;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:60px 24px}main{max-width:680px;margin:0 auto;background:#fff;border:1px solid #e4e4e7;border-radius:18px;padding:38px}header{font-size:13px;color:#6b7280;letter-spacing:.08em}h1{font-size:26px;font-weight:600;margin:20px 0 12px}p{line-height:1.7;margin:10px 0;color:#616161}.location{display:block;word-break:break-all;margin-top:6px;font-family:ui-monospace,monospace;color:#252525}.notice{padding:14px 16px;border-radius:9px;background:#fff5f3;color:#a33120;margin:20px 0;white-space:pre-wrap;overflow-wrap:anywhere}.warning{background:#fff8e5;color:#7b5900}label{display:block;font-size:14px;margin:24px 0 8px}input{width:100%;padding:12px;border:1px solid #d4d4d8;border-radius:8px;font:inherit;font-size:14px}button{border:1px solid #d4d4d8;border-radius:8px;background:#fff;color:#252525;padding:11px 16px;font:inherit;font-size:14px;cursor:pointer}button.primary{background:#252525;border-color:#252525;color:white}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:2px solid #3b82f6;outline-offset:3px}button:disabled,input:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.small{font-size:13px}hr{border:0;border-top:1px solid #eee;margin:28px 0}.status{min-height:24px;margin-top:15px} [hidden]{display:none!important}@media(max-width:540px){body{padding:24px 12px}main{padding:26px 22px}.actions button{width:100%}}
</style>
</head>
<body>
<main>
<header>FOLIO-J</header>
<h1 id="title">选择数据目录</h1>
<p id="intro">学习内容、设置和 API 密钥将保存在所选数据目录。启动成功后，应用会尝试记住这个位置。</p>
<div id="error" class="notice" role="alert" hidden></div>
<div id="warning" class="notice warning" hidden></div>
<div id="progress" hidden>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p id="stage-detail" class="small" hidden><span id="elapsed"></span><span id="target" class="location"></span></p>
</div>
<div id="ready" hidden>
<p class="small">本次使用的数据库文件<span id="ready-path" class="location"></span></p>
<button id="enter" class="primary" type="button">进入学习界面</button>
</div>
<div id="selection" hidden>
<p id="configured" class="small" hidden>原来配置的数据库文件<span id="configured-path" class="location"></span></p>
<div id="current-candidate" hidden><p class="small">本次选择的数据库文件<span id="retry-current-path" class="location"></span></p><button id="retry-current" class="primary" type="button">重试当前选择</button></div>
<p id="selected" class="small" hidden>当前尝试打开的数据库文件<span id="selected-path" class="location"></span></p>
<p class="small">默认数据目录<span id="default-path" class="location"></span></p>
<div class="actions"><button id="retry" class="primary" type="button" hidden>重试原配置位置</button><button id="default" class="primary" type="button" disabled>使用默认位置</button></div>
<hr>
<label for="directory">其他数据目录或数据库文件</label>
<input id="directory" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴数据目录或数据库文件的完整路径">
<p class="small">创建新数据时，请填写数据目录。打开已有数据时，可填写数据库文件的完整路径，或填写包含 app.db 的目录。</p>
<div class="actions">
<button id="new" type="button">在此创建新数据</button>
<button id="existing" type="button">打开已有数据</button>
</div>
</div>
<button id="reload-state" type="button" hidden>重新加载启动状态</button>
</main>
<script nonce="__FOLIO_STARTUP_NONCE__">
const token="__FOLIO_STARTUP_NONCE__";
const el=id=>document.getElementById(id);
const stateTimeout=4000;
const submitTimeout=10000;
const pollInterval=800;
let defaultDirectory="";
let stateLoaded=false;
let submitting=false;
let serverBusy=false;
let stateRequest=0;
let pollTimer;
function updateControls(){
 const disabled=!stateLoaded||submitting||serverBusy;
 el("selection").querySelectorAll("button,input").forEach(control=>control.disabled=disabled);
 el("default").disabled=disabled||!defaultDirectory;
}
function showProgress(stage){
 el("title").textContent="正在启动 Folio-J";
 el("intro").textContent="启动完成后会自动打开学习界面，或显示需要处理的问题。";
 el("progress").hidden=false;
 el("selection").hidden=true;
 el("error").hidden=true;
 el("warning").hidden=true;
 const status=stage?`${stage.name}…`:"正在检查启动状态…";
 if(el("status").textContent!==status)el("status").textContent=status;
 el("stage-detail").hidden=!stage;
 if(stage){
  el("elapsed").textContent=`已用时 ${Math.floor(stage.elapsed_ms/1000)} 秒`;
  el("target").textContent=stage.target;
 }
}
function showError(message){
 el("error").hidden=false;
 el("error").textContent=message;
}
function show(state){
 stateLoaded=true;
 serverBusy=state.busy;
 el("reload-state").hidden=true;
 updateControls();
 if(serverBusy){showProgress(state.stage);return;}
 el("progress").hidden=true;
 if(state.ready){
  if(!state.warning){location.replace("/");return;}
  el("title").textContent="应用已启动";
  el("intro").textContent="请查看以下启动提示。";
  el("error").hidden=true;
  el("warning").hidden=false;el("warning").textContent=state.warning;
  el("ready-path").textContent=state.selected_path||"";
  el("selection").hidden=true;el("ready").hidden=false;
  return;
 }
 defaultDirectory=state.default_directory;
 el("selection").hidden=false;
 el("default-path").textContent=defaultDirectory;
 el("error").hidden=!state.error;el("error").textContent=state.error||"";
 el("warning").hidden=!state.warning;el("warning").textContent=state.warning||"";
 el("configured").hidden=!state.configured_path;el("configured-path").textContent=state.configured_path||"";
 el("selected").hidden=!state.selected_path||state.selected_path===state.configured_path||state.selected_path===state.retry_current_path;el("selected-path").textContent=state.selected_path||"";
 el("current-candidate").hidden=!state.retry_current_path;
 el("retry-current-path").textContent=state.retry_current_path||"";
 el("retry").hidden=!state.recovery;
 el("default").textContent=state.recovery?"在默认位置创建新数据":"使用默认位置";
 if(state.recovery&&state.selected_path&&!el("directory").value)el("directory").value=state.selected_path;
 el("title").textContent=state.recovery?"无法打开学习数据":"选择数据目录";
 el("intro").textContent=state.recovery?"请检查数据库文件和数据目录的访问权限后重试，或选择另一份已有数据。":"学习内容、设置和 API 密钥将保存在所选数据目录。启动成功后，应用会尝试记住这个位置。";
 updateControls();
}
function scheduleState(){
 clearTimeout(pollTimer);
 pollTimer=setTimeout(()=>loadState(),pollInterval);
}
async function loadState(message=""){
 clearTimeout(pollTimer);
 const request=++stateRequest;
 el("reload-state").hidden=true;
 try{
  const response=await fetch("/_startup/state",{cache:"no-store",signal:AbortSignal.timeout(stateTimeout)});
  if(!response.ok)throw new Error();
  const state=await response.json();
  if(request!==stateRequest)return;
  if(!submitting||state.busy)show(state);
  if(submitting||state.busy)scheduleState();
  else if(message&&!state.ready&&!state.error)showError(message);
 }catch{
  if(request!==stateRequest)return;
  if(submitting){scheduleState();return;}
  stateLoaded=false;
  updateControls();
  el("title").textContent="无法确认启动状态";
  el("intro").textContent="请确认终端中的 Folio-J 服务仍在运行。";
  el("progress").hidden=true;
  showError("暂时无法连接启动服务。请重新加载启动状态后再操作。");
  el("reload-state").hidden=false;
 }
}
async function choose(directory,mode,retry=null){
 if(!stateLoaded||submitting||serverBusy)return;
 submitting=true;
 updateControls();
 showProgress(null);
 scheduleState();
 let message="未收到提交结果，请根据当前启动状态操作。";
 try{
  const response=await fetch(retry||"/_startup/select",{
   method:"POST",headers:{"Content-Type":"application/json","X-Folio-Startup-Token":token},
   body:retry?undefined:JSON.stringify({directory,mode}),signal:AbortSignal.timeout(submitTimeout)
  });
  const state=await response.json();
  if(response.ok){
   clearTimeout(pollTimer);
   stateRequest++;
   submitting=false;
   show(state);
   return;
  }
  if(typeof state.detail==="string")message=state.detail;
 }catch{/* The server can still be running the submitted operation. */}
 submitting=false;
 stateLoaded=false;
 updateControls();
 await loadState(message);
}
el("reload-state").addEventListener("click",()=>loadState());
el("retry").addEventListener("click",()=>choose("","existing","/_startup/retry"));
el("retry-current").addEventListener("click",()=>choose("","existing","/_startup/retry-current"));
el("default").addEventListener("click",()=>{if(stateLoaded&&defaultDirectory)choose(defaultDirectory,"new");});
el("new").addEventListener("click",()=>choose(el("directory").value,"new"));
el("existing").addEventListener("click",()=>choose(el("directory").value,"existing"));
el("enter").addEventListener("click",()=>location.replace("/"));
showProgress(null);
loadState();
</script>
</body>
</html>
