name: Windows experimental

on:
  pull_request:
  push:
    branches: [main, "codex/windows-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - name: Install locked dependencies using native PowerShell recipes
        run: just setup
      - name: Static checks
        run: just lint
      - name: Windows launch, reload and repeated-stop regressions
        run: uv run --project backend pytest backend/tests/test_run_script.py backend/tests/test_windows_reload.py -q -ra
      - name: Offline backend and frontend tests
        env:
          PYTEST_ADDOPTS: "-ra --durations=10"
        run: just test
      - name: Production build
        run: just build
      - name: Chrome component smoke
        env:
          BROWSER_TEST_SUITE: app-theme
        run: just test-browser
      - name: Edge component smoke
        env:
          BROWSER_TEST_SUITE: native-select
        run: |
          $env:CHROME_BIN = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          just test-browser
      - name: Package committed source
        run: uv run --project backend python scripts/package_release.py --ref HEAD --version windows-smoke --output "$env:RUNNER_TEMP/source.zip"
      - name: Source ZIP migration, launch, interrupt, backup and restore
        run: uv run --project backend python scripts/smoke_source.py "$env:RUNNER_TEMP/source.zip"

  frozen:
    name: Experimental frozen Windows ZIP
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/frozen-build-venv
      FROZEN_OUTPUT: ${{ runner.temp }}/frozen-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Identify the experimental build from the checked-out commit
        run: |
          $shortSha = git rev-parse --short=12 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FROZEN_VERSION=windows-frozen-ci-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked production and packaging dependencies in an isolated environment
        run: |
          uv sync --project backend --python 3.11 --locked --no-dev --group packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the frontend and frozen Windows ZIP
        run: |
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:UV_PROJECT_ENVIRONMENT 'Scripts/python.exe') scripts/package_frozen.py --version $env:FROZEN_VERSION --output $env:FROZEN_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline smoke of the built directory package
        run: |
          python scripts/smoke_frozen.py (Join-Path $env:FROZEN_OUTPUT 'Folio-J')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract the ZIP to a Chinese path containing spaces and repeat the offline smoke
        run: |
          $archives = @(Get-ChildItem -LiteralPath $env:FROZEN_OUTPUT -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one frozen ZIP, found $($archives.Count)" }
          $destination = Join-Path $env:RUNNER_TEMP '冻结包 解压验收'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $destination
          python scripts/smoke_frozen.py (Join-Path $destination 'Folio-J')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect matching source, metadata and SHA-256 checksums after both smokes pass
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Get-Content -LiteralPath (Join-Path $env:FROZEN_OUTPUT 'Folio-J/BUILD.json') -Raw | ConvertFrom-Json
          if ($build.commit -ne $commit -or $build.version -ne $env:FROZEN_VERSION -or $build.dirty) {
            throw 'Frozen build must match the clean checked-out commit and CI version'
          }
          $sourceName = "Folio-J-$env:FROZEN_VERSION-source.zip"
          $sourcePath = Join-Path $env:FROZEN_OUTPUT $sourceName
          git archive --format=zip --prefix=Folio-J-source/ --output=$sourcePath HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath $env:FROZEN_OUTPUT -Filter '*.zip' -File | ForEach-Object { $_.Name })
          $files += 'SIZE.json', 'Folio-J/BUILD.json', 'Folio-J/RELEASE.json'
          $checksums = foreach ($relative in ($files | Sort-Object)) {
            $hash = Get-FileHash -LiteralPath (Join-Path $env:FROZEN_OUTPUT $relative) -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $relative"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $env:FROZEN_OUTPUT 'SHA256SUMS.txt') -Encoding utf8
      - name: Upload the verified experimental ZIP and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: Folio-J-${{ env.FROZEN_VERSION }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ env.FROZEN_OUTPUT }}/*.zip
            ${{ env.FROZEN_OUTPUT }}/SIZE.json
            ${{ env.FROZEN_OUTPUT }}/Folio-J/BUILD.json
            ${{ env.FROZEN_OUTPUT }}/Folio-J/RELEASE.json
            ${{ env.FROZEN_OUTPUT }}/SHA256SUMS.txt
