<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/svg+xml" href="/folio-mark.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("folio-appearance-v1") || "system"; } catch {}
        const mode = preference === "light" || preference === "dark"
          ? preference
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === "dark" ? "#15181d" : "#f7f8f9";
      })();
    </script>
    <title>Folio-J · 日语学习资料</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
