  <header class="topbar"><span class="brand">Folio-J</span><span class="sep"></span><span class="book-label">雨上がりの切符</span><div class="top-actions"><button type="button" class="cursor-interaction" data-act="book"><i data-lucide="arrow-left" aria-hidden="true"></i>书籍</button><button type="button" class="cursor-interaction" data-act="records" aria-label="阅读记录"><i data-lucide="notebook-text" aria-hidden="true"></i><span class="records-label">阅读记录</span></button></div></header>
  <main class="main"></main>
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script>
  (()=>{
    const root=document.getElementById('folio-reading-aids');
    if(!root)return;
    const main=root.querySelector('.main');
    const sentences=[
      '雨がやんだばかりの駅前には、まだ傘を閉じるのをためらっている人がいた。',
      '美緒はポケットの切符を指で確かめ、古い時計の下で足を止めた。',
      'もう来ないとわかっているのに、誰かを待つふりをするのは、思ったほど難しくなかった。',
      '売店のおばあさんが、今朝は少し冷えるね、と湯気の向こうから声をかけてきた。',
      'その何でもないひと言に、美緒はようやく、自分がどこへ行きたいのかを考え始めた。',
      'ホームに電車が入ってきても、彼女は急いで歩こうとはしなかった。',
      '水たまりに映った空が、さっきより少しだけ明るくなっていた。'
    ];
    const translations=[
      '雨刚停的车站前，还有人迟疑着，没有把伞收起来。',
      '美绪用指尖确认了一下口袋里的车票，在那座老钟下面停下脚步。',
      '明知道对方已经不会来了，装作还在等谁，却并没有想象中那么难。',
      '小卖部的老奶奶隔着升起的热气招呼她：“今天早上有点凉呢。”',
      '正是这句平常的话，让美绪终于开始思考，自己究竟想去哪里。',
      '即使列车驶入站台，她也没有打算加快脚步。',
      '映在水洼里的天空，比刚才稍稍明亮了一点。'
    ];
    const seedMarkdown='这句话的重心不是“等待”，而是她发现自己仍然能够维持等待的姿态。前半句说明现实，后半句写她对自己的意外发现。\n\n## 「とわかっているのに」\n\n「もう来ない」是「わかっている」所理解的内容。「と」把这个判断接到「わかる」上；「ている」在这里表示她已经知道并持续明白这一事实。\n\n「のに」把这个认知和后面的行为放在一起，形成一种不合常理的对照：既然知道不会来了，似乎就没有继续等的理由，然而她仍留在那里。\n\n## 「誰かを待つふりをする」\n\n「ふりをする」表示做出某种样子。这里说的是**装作在等人**，并没有直接说她在欺骗具体的某个人。\n\n- 「待つ」：实际等待。\n- 「待つふりをする」：呈现出等待的样子。\n\n「誰か」没有把等待对象说清楚，与前面的“已经不会来了”放在一起，让她停留在车站的动作显得更含混。\n\n## 「思ったほど難しくなかった」\n\n「ほど」在否定句中给出一个没有达到的程度：“并没有达到原先以为的那么难。”不是说这件事完全容易，而是实际感受与预期不同。\n\n> 她原以为自己很难再站在那里，可当她真正停下时，发现等待的姿态仍然如此自然。\n\n原文没有明确交代她在等谁，也没有直接说出她的情绪。理解句法之后，可以保留这份不确定，不必替小说补全答案。';
    const records=new Map();
    const learning=new Map();
    const full=i=>({sid:i,start:0,end:sentences[i].length,text:sentences[i]});
    const key=t=>`${t.sid}:${t.start}:${t.end}`;
    [0,2,4].forEach(i=>{const t=full(i);records.set(key(t),{...t,key:key(t),translation:i===4?'':translations[i],audio:i!==0,analysis:i===2?{id:'analysis-1',title:'明知道不会来了，为什么还在等？',body:seedMarkdown,revision:1}:null,segment:i===2?'segment-1':null});});
    records.forEach((r,k)=>{if(r.analysis)learning.set(k,r);});
    let view='reader',tab='records',activeKey=key(full(0)),activeTarget=full(0),cardOpen=true,vertical=false,marks=true,readerScroll={top:0,left:0},search='',detailOpen=true,selectionTarget=null,selectionRect=null,editingTranslation=null,translationDraft='',editingAnalysis=null,analysisPreview=false,analysisOrigin='reader',readerObserver=null,playingKey=null,toastTimer=null,groupKeys=null;
    const pending=new Map();
    const translationDrafts=new Map(),analysisDrafts=new Map();
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
    const button=(act,label,cls='',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-act="${act}" ${extra}>${label}</button>`;
    const icons=()=>{if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});};
    const status=r=>`<span class="content-status">${r.translation?'<span>译</span>':''}${r.audio?'<span>音</span>':''}${r.analysis?'<span>解</span>':''}</span>`;
    const current=()=>records.get(activeKey)||learning.get(activeKey);
    function notify(message){const el=root.querySelector('.toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2200);}
    function markdown(source){
      const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
      let out='',list=false,para=[];

    function updateFocusColors(){const probe=document.createElement('span');probe.hidden=true;probe.style.backgroundColor='var(--fj-selection)';probe.style.color='var(--fj-ink)';root.appendChild(probe);const colors=getComputedStyle(probe);focusStyle.textContent='#folio-reading-aids ::highlight(folio-demo-focus){background:'+colors.backgroundColor+';color:'+colors.color+'}';probe.remove();}
    updateFocusColors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',updateFocusColors);
    render();icons();
  })();
  </script>
</div>
