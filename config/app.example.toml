# 应用运行配置。可复制到 ~/Folio-J-Data/app.toml 或项目 config/app.toml 后按需修改。
# 真实配置不进入 Git。
# Provider 与密钥通过设置界面维护，请勿在此提交凭据。
[server]
host = "127.0.0.1"
port = 8010
# 仅 just dev 使用；just start 由应用端口同时提供页面和 API。
dev_port = 5187

[database]
# 默认数据库为 ~/Folio-J-Data/app.db。需要其他位置时，取消注释并填写绝对路径。
# path = "/absolute/path/to/app.db"

# 翻译资源候选值，待真实日轻样句与模型实测后调整。
# 语境的日常摘录偏好在界面保存；这里限制单次实际请求。
[translation]
max_target_characters = 2000
max_context_characters = 2000
timeout_seconds = 120
max_pending = 3
# 模型已配置输出上限时采用模型值；未配置时使用此候选值。
default_max_output_tokens = 4000
